version: 2
updates:
  # Escaneo de dependencias npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    labels:
      - "seguridad"
      - "dependencias"
    # Ignorar actualizaciones de versiones mayores (pueden tener breaking changes)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Agrupar TODAS las actualizaciones menores y de parches en un solo PR
    groups:
      actualizaciones-menores:
        update-types:
          - "minor"
          - "patch"
